<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: อบอุ่น รื่นเริงแบบเงียบๆ คืนริมน้ำ
   IDEA: ลานท่าน้ำหน้าซุ้มประตูหัวเฉียว ที่ทุกคนเดินถือกระทงไปวางลงแม่น้ำสายเดียวกัน
   PICTURE: แคนวาสเต็มจอ — ฟ้าคืน ซุ้มประตูป้ายสามภาษา สะพานไม้ ตัวละครชิบิชุดนักศึกษา แสงเทียนบนน้ำ
   COLOUR and TYPE: น้ำเงินเที่ยงคืน ทองแสงเทียน แดงโคมจีน; Mali + Noto Sans Thai Looped (ไทยหัวกลม)
   LAYOUT: ฉากเต็มจอ แถบบนบาง จอยซ้ายล่าง ปุ่มแอ็กชันขวาล่าง ที่เหลือเป็น bottom sheet */
:root{color-scheme:dark;--deep:#050b22;--gold:#f2c14e;--gold2:#ffdf8a;--ink:#fff6e3;--mute:#b9c3e6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--deep);color:var(--ink);font:16px/1.5 "Noto Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:start;pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-family:Mali,sans-serif;line-height:1.05}
.brand b{display:block;font-weight:600;font-size:26px;color:var(--gold2);text-shadow:0 0 18px rgba(242,193,78,.45)}
.brand span{font-size:13px;color:var(--mute)}
.tools{display:flex;gap:6px}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid rgba(242,193,78,.35);background:rgba(5,11,34,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--gold2);display:grid;place-items:center;cursor:pointer;padding:0}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.counter{grid-column:1/-1;justify-self:start;margin:0;padding:6px 12px;border-radius:999px;background:rgba(5,11,34,.62);border:1px solid rgba(242,193,78,.3);font-size:13px;line-height:1.35}
.counter b{color:var(--gold2);font-family:Mali,sans-serif;font-weight:500;font-size:16px}
.counter small{display:block;color:var(--mute);font-size:12px}
.hud{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:flex-end;align-items:flex-end;pointer-events:none}
.hud>*{pointer-events:auto}
#joy{width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(5,11,34,.4);border:1.5px solid rgba(242,193,78,.45);position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .12s}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe7a3,#d99a2b);box-shadow:0 0 18px rgba(242,193,78,.5)}
.acts{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.emos{display:flex;gap:8px}
.emos[hidden]{display:none}
#fwPick{flex-wrap:wrap;justify-content:flex-end;max-width:330px}
#fwPick .pill i{width:12px;height:12px;border-radius:50%;display:inline-block}
#bFw:disabled{opacity:.55}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(242,193,78,.45);background:rgba(5,11,34,.7);color:var(--gold2);font:600 14px "Noto Sans Thai Looped",sans-serif;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mid{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 136px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
.mid>*{pointer-events:auto}
#bRel{min-height:56px;padding:0 26px;border:0;border-radius:999px;background:linear-gradient(180deg,#ffd978,#e9a93a);color:#3a2205;font:600 19px Mali,sans-serif;box-shadow:0 8px 30px rgba(242,170,60,.5);cursor:pointer;animation:pop .5s ease-out}
#bRel[hidden],#hint[hidden]{display:none}
#hint{margin:0;font-size:13px;color:var(--ink);background:rgba(5,11,34,.7);padding:6px 12px;border-radius:999px;text-align:center}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
body.clean .top,body.clean .hud,body.clean .mid{opacity:0;pointer-events:none}
body.clean .top>*,body.clean .hud>*,body.clean .mid>*{pointer-events:none}
.top,.hud,.mid{transition:opacity .3s}
.scrim{position:fixed;inset:0;background:rgba(2,6,20,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#10214f,#081232);border:1px solid rgba(242,193,78,.3);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sheet h2{font:600 24px/1.15 Mali,sans-serif;margin:4px 0 6px;color:var(--gold2)}
.sub{margin:0 0 4px;color:var(--mute);font-size:14px}
.l{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute);margin:12px 0 6px}
.l span:last-child{white-space:nowrap}
input,textarea{width:100%;font:16px "Noto Sans Thai Looped",sans-serif;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 14px}
textarea{resize:none;height:72px;display:block}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pick{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 6px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.opt{flex:none;scroll-snap-align:center;width:112px;border-radius:16px;border:2px solid rgba(255,255,255,.08);background:radial-gradient(circle at 50% 75%,#1d3a7a,#0a1638 70%);color:var(--ink);padding:6px 6px 8px;cursor:pointer;font:12.5px/1.25 "Noto Sans Thai Looped",sans-serif}
.opt canvas{width:96px;height:96px;display:block;margin:0 auto 4px}
.opt.k canvas{height:76px}
.mini{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(242,193,78,.5);background:rgba(242,193,78,.12);color:var(--gold2);font:600 13px "Noto Sans Thai Looped",sans-serif;cursor:pointer}
.ward{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;align-items:center;background:radial-gradient(circle at 25% 60%,#1d3a7a,#0a1638 70%);border-radius:16px;padding:8px}
#lookPv{width:116px;height:145px}
.rows{display:grid;gap:6px}
.st{display:grid;grid-template-columns:58px 36px minmax(0,1fr) 36px;align-items:center;gap:4px;font-size:13px}
.st .lab{color:var(--mute)}.st b{text-align:center;font-weight:600;font-size:13px;line-height:1.2}
.sb{width:36px;height:36px;border-radius:50%;border:1px solid rgba(242,193,78,.4);background:rgba(0,0,0,.2);color:var(--gold2);font-size:20px;cursor:pointer;padding:0}
.sw{display:flex;gap:6px;flex-wrap:wrap;grid-column:2/-1}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,193,78,.35)}
.ktn{color:var(--gold2);font-weight:600}
.kc{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:2px}
.kc .pick .opt{width:44%}
.kc .arr{width:34px;height:34px;border-radius:50%;border:1px solid rgba(242,193,78,.45);background:rgba(0,0,0,.25);color:var(--gold2);font-size:20px;cursor:pointer;padding:0;line-height:1}
.kc.grid{grid-template-columns:minmax(0,1fr)}.kc.grid .arr{display:none}
.kc.grid .pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible}.kc.grid .pick .opt{width:auto;padding:4px}.kc.grid .opt canvas{width:100%;height:auto;aspect-ratio:192/152}
.kfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.kfoot[hidden]{display:none}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.on{background:var(--gold);width:18px;border-radius:4px}
.more{border:0;background:none;color:var(--gold2);font:600 13px "Noto Sans Thai Looped",sans-serif;cursor:pointer;animation:nudge 1.6s ease-in-out infinite;min-height:32px}
@keyframes nudge{50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.opt[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.18)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ghost{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(242,193,78,.45);background:rgba(0,0,0,.15);color:var(--gold2);font:15px "Noto Sans Thai Looped",sans-serif;cursor:pointer}
.err{color:#ffaaa5;font-size:14px;min-height:1.5em;margin:8px 0 6px}
.big{width:100%;min-height:56px;border:0;border-radius:999px;background:linear-gradient(180deg,#ffd978,#e9a93a);color:#3a2205;font:600 19px Mali,sans-serif;box-shadow:0 8px 30px rgba(242,170,60,.35);cursor:pointer}
.big:disabled{opacity:.6;cursor:wait}
.who{color:var(--gold2);font-size:15px;margin:0}
.msg{font:500 22px/1.4 Mali,sans-serif;margin:6px 0 14px;overflow-wrap:anywhere}
.likes{color:#ffb3c4;font-size:15px;margin:0 0 12px}
.heart{width:100%;min-height:54px;border-radius:999px;border:0;background:linear-gradient(180deg,#ff8fae,#e2486f);color:#fff;font:600 18px Mali,sans-serif;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}
.heart svg{width:22px;height:22px;fill:#fff}
.heart:disabled{background:rgba(255,255,255,.12);color:var(--mute);cursor:default}
.heart:disabled svg{fill:var(--mute)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:center;cursor:pointer}
.rk{font:600 20px Mali,sans-serif;color:var(--gold);text-align:center}
.nm{font-weight:600;display:block}
.ms{font-size:14px;color:var(--mute);overflow-wrap:anywhere;display:block}
.lk{white-space:nowrap;color:#ffb3c4;font-weight:600}
.empty{color:var(--mute);text-align:center;padding:24px 0;display:block!important}
.cardimg{display:block;margin:0 auto;height:min(56vh,640px);aspect-ratio:9/16;border-radius:14px;background:#0a1638;object-fit:contain;-webkit-touch-callout:default}
.hint2{font-size:13px;color:var(--mute);text-align:center;margin:8px 0 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 118px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;width:max-content;max-width:calc(100% - 32px);background:rgba(8,18,50,.92);border:1px solid rgba(242,193,78,.4);border-radius:16px;padding:10px 14px;font-size:14px;transition:opacity .25s,transform .25s;display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:36px;border-radius:999px;border:0;background:var(--gold);color:#3a2205;font:600 14px "Noto Sans Thai Looped",sans-serif;padding:0 12px;cursor:pointer;white-space:nowrap}
.toast button[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}#bRel{animation:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="ลานท่าน้ำหน้าซุ้มประตู HCU แตะบนสะพานเพื่อเดิน แตะกระทงในน้ำเพื่อดูคำอธิษฐาน"></canvas>

<header class="top">
  <div class="brand"><b>ลอยกระทง HCU</b><span>ลานท่าน้ำ · 2569</span></div>
  <div class="tools">
    <button class="ic" id="bTop" aria-label="กระทงที่ได้กำลังใจสูงสุดวันนี้"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M9.5 17h5"/></svg></button>
    <button class="ic" id="bSnd" aria-label="เปิดเสียง" aria-pressed="false"><svg viewBox="0 0 24 24" id="sndIc"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></button>
    <button class="ic" id="bMe" aria-label="แก้ตัวละครและรับกระทงใหม่"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
  </div>
  <p class="counter" id="counter">กำลังเชื่อมต่อแม่น้ำ…</p>
</header>

<div class="mid">
  <button id="bRel" hidden>วางกระทงลงน้ำ</button>
  <p id="hint" hidden></p>
</div>

<div class="hud">
  <div class="acts">
    <div class="emos" id="emos" hidden>
      <button class="pill" data-em="wave">โบกมือ</button>
      <button class="pill" data-em="pray">สาธุ</button>
      <button class="pill" data-em="heart">หัวใจ</button>
    </div>
    <div class="emos" id="fwPick" hidden></div>
    <div class="emos">
      <button class="pill" id="bFw" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg><span id="fwTxt">จุดพลุ</span></button>
      <button class="pill" id="bEmo" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1V4.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L3.6 14a1.6 1.6 0 0 1 2.6-1.8L8 14"/></svg>ทักทาย</button>
      <button class="pill" id="bCam" aria-label="แคปภาพลงสตอรี่"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>แคป</button>
    </div>
  </div>
</div>

<div id="joy" aria-hidden="true"><div id="knob"></div></div>
<div class="scrim" id="scrim"></div>

<section class="sheet" id="sSetup" role="dialog" aria-modal="true" aria-labelledby="hSetup">
  <div class="grab"></div>
  <h2 id="hSetup">เตรียมตัวไปลอยกระทง</h2>
  <p class="sub">แต่งตัวละคร เลือกกระทง แล้วเดินไปวางที่ขอบสะพาน</p>
  <form id="fSetup" autocomplete="off">
    <label class="l" for="fName"><span>ชื่อเล่น (ลอยอยู่บนหัว)</span><span id="cName">0/20</span></label>
    <input id="fName" maxlength="20" placeholder="เว้นว่างได้ จะใช้ชื่อ “ชาว HCU”">
    <div class="l"><span>แต่งตัวละคร (มิกซ์ได้อิสระ)</span><button type="button" class="mini" id="bLookRand">สุ่มลุค</button></div>
    <div class="ward">
      <canvas id="lookPv" width="240" height="300" aria-label="ตัวอย่างตัวละคร"></canvas>
      <div class="rows" id="wardRows"></div>
    </div>
    <div class="l"><span>แบบกระทง <b id="ktName" class="ktn"></b></span><button type="button" class="mini" id="kAll" aria-expanded="false">ดูทั้งหมด 8 แบบ</button></div>
    <div class="kc" id="kc">
      <button type="button" class="arr" id="kPrev" aria-label="แบบก่อนหน้า">‹</button>
      <div class="pick" id="pickK"></div>
      <button type="button" class="arr" id="kNext" aria-label="แบบถัดไป">›</button>
    </div>
    <div class="kfoot" id="kfoot"><div class="dots" id="kDots"></div><button type="button" class="more" id="kMore">เลื่อนดูแบบอื่นอีก →</button></div>
    <label class="l" for="fWish"><span>คำอธิษฐาน</span><span id="cWish">0/50</span></label>
    <textarea id="fWish" maxlength="50" placeholder="ขอให้…"></textarea>
    <div class="row"><button type="button" class="ghost" id="bRand">สุ่มคำอวยพรสำเร็จรูป</button></div>
    <p class="err" id="err" role="alert"></p>
    <button class="big" id="bEnter" type="submit">เข้าสู่ลานลอยกระทง</button>
  </form>
</section>

<section class="sheet" id="sView" role="dialog" aria-modal="true" aria-labelledby="vName">
  <div class="grab"></div>
  <p class="who" id="vName"></p>
  <p class="msg" id="vMsg"></p>
  <p class="likes" id="vLikes"></p>
  <button class="heart" id="bHeart"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.6 0 6 3.5 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg><span id="hTxt">ส่งกำลังใจ</span></button>
</section>

<section class="sheet" id="sTop" role="dialog" aria-modal="true" aria-labelledby="hTop">
  <div class="grab"></div>
  <h2 id="hTop">กำลังใจสูงสุดวันนี้</h2>
  <ol class="tl" id="topList"></ol>
</section>

<section class="sheet" id="sCard" role="dialog" aria-modal="true" aria-labelledby="hCard">
  <div class="grab"></div>
  <h2 id="hCard">ภาพลงสตอรี่</h2>
  <img class="cardimg" id="cardImg" alt="การ์ดลอยกระทง HCU">
  <p class="hint2" id="cardHint">กดค้างที่รูปเพื่อบันทึก แล้วแชร์ลงสตอรี่ได้เลย</p>
  <div class="row" style="justify-content:center">
    <button class="ghost" id="bSave" hidden>บันทึกรูป</button>

function wrap(c,text,maxW){const seg=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter('th',{granularity:'word'}).segment(text)].map(s=>s.segment):[...text];const lines=[];let cur='';
  seg.forEach(w=>{if(c.measureText(cur+w).width>maxW&&cur){lines.push(cur);cur=w.trimStart()}else cur+=w});if(cur)lines.push(cur);return lines}
let cardURL='';
async function makeCard(){
  try{await document.fonts.ready}catch(e){}
  const CW=1080,CH=1920,c=document.createElement('canvas');c.width=CW;c.height=CH;const x=c.getContext('2d'),t=performance.now()/1000;
  const P=drawStatic(x,CW,CH);drawWater(x,CW,CH,t,P);drawRail(x,CW,P,t);
  const ks=[...krs.values()].filter(k=>!myKr.has(k.rec.id)).slice(0,4);ks.forEach((k,i)=>drawKrathong(x,k.rec.krathong_type,CW*(.12+i*.25),P.f0+40+(i%2)*80,1.3,t,k.phase));
  const mine=lastMine||(me&&{name:me.name,message:me.wish,krathong_type:me.kt});
  if(me)drawChar(x,parseLook(me.ch),CW*.38,P.deckBot-24,4.2,{st:'idle',a:0,ph:0,face:1,seed:1,hk:me.hk,kt:me.kt,em:null,emA:9},t);
  if(mine&&!(me&&me.hk))drawKrathong(x,mine.krathong_type,CW*.64,P.n0+30,2.6,t,1);
  x.strokeStyle='#f2c14e';x.lineWidth=6;rr(x,40,40,CW-80,CH-80,36);x.stroke();x.lineWidth=2;x.strokeStyle='rgba(242,193,78,.6)';rr(x,58,58,CW-116,CH-116,26);x.stroke();
  const py=CH-340;x.fillStyle='rgba(5,12,36,.85)';rr(x,96,py,CW-192,250,32);x.fill();x.strokeStyle='rgba(242,193,78,.45)';x.lineWidth=2;x.stroke();x.textAlign='center';x.textBaseline='alphabetic';
  x.fillStyle='#f2c14e';x.font='500 34px Mali,sans-serif';x.fillText('ลอยกระทง HCU 2569',CW/2,py+58);
  if(mine){x.fillStyle='#ffdf8a';x.font='600 48px Mali,sans-serif';x.fillText(mine.name,CW/2,py+118);x.fillStyle='#fff6e3';x.font='500 40px Mali,sans-serif';wrap(x,'“'+mine.message+'”',CW-280).slice(0,2).forEach((l,i)=>x.fillText(l,CW/2,py+176+i*52))}
  else{x.fillStyle='#fff6e3';x.font='500 44px Mali,sans-serif';x.fillText('มาลอยกระทงออนไลน์กับชาว HCU กัน',CW/2,py+150)}
  return c.toDataURL('image/jpeg',.9);
}
async function showCard(){close();$('#toast').classList.remove('on');cardURL=await makeCard();$('#cardImg').src=cardURL;$('#cardHint').textContent=lastMine?'กดค้างที่รูปเพื่อบันทึก แล้วแชร์ลงสตอรี่ได้เลย':'ยังไม่ได้วางกระทง — วางก่อนเพื่อใส่ชื่อและคำอธิษฐานลงการ์ด';open('#sCard')}

/* ---------- เสียง ---------- */
let actx=null,master=null,musicT=0,soundOn=false;
const NOTES=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];
function pluck(f,when,vol){const o=actx.createOscillator(),o2=actx.createOscillator(),gn=actx.createGain();o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
  gn.gain.setValueAtTime(.0001,when);gn.gain.exponentialRampToValueAtTime(vol,when+.01);gn.gain.exponentialRampToValueAtTime(.0001,when+1.1);o.connect(gn);o2.connect(gn);gn.connect(master);o.start(when);o2.start(when);o.stop(when+1.2);o2.stop(when+1.2)}
function startAudio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('เบราว์เซอร์นี้เล่นเสียงไม่ได้');return false}
    actx=new AC();master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
    const n=actx.sampleRate*3,buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;const wg=actx.createGain();wg.gain.value=.5;
    const lfo=actx.createOscillator();lfo.frequency.value=.15;const lg=actx.createGain();lg.gain.value=.2;lfo.connect(lg);lg.connect(wg.gain);lfo.start();src.connect(lp);lp.connect(wg);wg.connect(master);src.start()}
  actx.resume();master.gain.setTargetAtTime(.6,actx.currentTime,.4);
  let idx=2;clearInterval(musicT);musicT=setInterval(()=>{if(Math.random()<.28)return;idx=clamp(idx+[-2,-1,-1,1,1,2][Math.random()*6|0],0,NOTES.length-1);pluck(NOTES[idx],actx.currentTime+.02,.07);if(Math.random()<.2)pluck(NOTES[Math.max(0,idx-3)]/2,actx.currentTime+.02,.05)},430);
  return true;
}
function stopAudio(){if(actx)master.gain.setTargetAtTime(0,actx.currentTime,.2);clearInterval(musicT)}
$('#bSnd').onclick=()=>{soundOn=!soundOn;if(soundOn&&!startAudio())soundOn=false;if(!soundOn)stopAudio();const b=$('#bSnd');b.setAttribute('aria-pressed',soundOn);b.setAttribute('aria-label',soundOn?'ปิดเสียง':'เปิดเสียง');
  $('#sndIc').innerHTML=soundOn?'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>':'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/>'};
