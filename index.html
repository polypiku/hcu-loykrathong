<body>
<canvas id="scene" aria-label="HCU Loy Krathong"></canvas>

<header class="top">
  <div class="brand"><b data-t="brand">ลอยกระทง HCU</b><span data-t="brandSub">ลานท่าน้ำ · 2569</span></div>
  <div class="tools">
    <button class="ic" id="bTop" data-ta="aTop"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M9.5 17h5"/></svg></button>
    <button class="ic" id="bSnd" aria-pressed="false" data-ta="sndOn"><svg viewBox="0 0 24 24" id="sndIc"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></button>
    <button class="ic" id="bMe" data-ta="aMe"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
  </div>
  <p class="counter" id="counter" data-t="connecting">กำลังเชื่อมต่อแม่น้ำ…</p>
</header>

<div class="mid">
  <button id="bRel" hidden data-t="rel">วางกระทงลงน้ำ</button>
  <p id="hint" hidden></p>
</div>

<div class="hud">
  <div class="acts">
    <div class="emos" id="emos" hidden>
      <button class="pill" data-em="wave" data-t="wave">โบกมือ</button>
      <button class="pill" data-em="pray" data-t="pray">สาธุ</button>
      <button class="pill" data-em="heart" data-t="heart">หัวใจ</button>
    </div>
    <div class="emos" id="fwPick" hidden></div>

function wrap(c,text,maxW){const seg=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter(LANG==='zh'?'zh':LANG==='en'?'en':'th',{granularity:'word'}).segment(text)].map(s=>s.segment):[...text];const lines=[];let cur='';

function sparkleRing(x,cx,cy,r,col,n){x.save();x.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const a=i/n*6.283,rr2=r*(.85+.15*((i*7)%5)/5);x.fillStyle=`rgba(${col},${.5+.5*((i*3)%4)/4})`;x.beginPath();x.arc(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2,4,0,7);x.fill()}x.restore()}
async function makeCard(){
  try{await document.fonts.ready}catch(e){}
  const CW=1080,CH=1920,c=document.createElement('canvas');c.width=CW;c.height=CH;const x=c.getContext('2d'),t=performance.now()/1000;
  const P=drawStatic(x,CW,CH);drawWater(x,CW,CH,t,P);drawRail(x,CW,P,t);
  sparkleRing(x,190,330,110,'255,200,90',36);sparkleRing(x,880,250,90,'255,110,160',30);sparkleRing(x,880,250,50,'255,220,120',18);
  const lk=me?parseLook(me.ch):look,kt=(lastMine&&lastMine.krathong_type)||(me&&me.kt)||selK,mine=lastMine||(me&&{name:me.name,message:me.wish,krathong_type:kt});
  const fy=P.deckBot-46,cx=CW/2,wy=P.deckBot+118;
  const base={st:'idle',a:0,ph:0,face:1,dir:'down',seed:1,kt,em:null,emA:9};
  const ripple=(rx,ry)=>{x.save();x.strokeStyle='rgba(255,230,170,.5)';x.lineWidth=3;[1,1.7,2.4].forEach(k=>{x.beginPath();x.ellipse(rx,ry,60*k,12*k,0,0,7);x.stroke()});x.restore()};
  if(pose===0)drawChar(x,lk,cx,fy,8.6,{...base,hk:true,ks:.62},t);
  else if(pose===1){drawKrathong(x,kt,cx+290,wy,3.2,t,2);drawChar(x,lk,cx-70,fy,8.6,{...base,hk:false,em:'pray',emA:0},t)}
  else if(pose===2){drawKrathong(x,kt,cx-290,wy,3.2,t,3);drawChar(x,lk,cx+70,fy,8.6,{...base,hk:false,pose:'v'},t)}
  else if(pose===3){ripple(cx,P.deckBot+150);drawChar(x,lk,cx,P.deckBot-2,8.6,{...base,hk:true,ks:.62,pose:'sit'},t)}
  else{const pl=partnerSnap?parseLook(partnerSnap.ch):lk;drawKrathong(x,kt,cx,wy+10,3,t,4);drawChar(x,lk,cx-150,fy,7.6,{...base,hk:false,hold:1},t);drawChar(x,pl,cx+150,fy,7.6,{...base,hk:false,hold:-1,seed:4},t);
    x.fillStyle='rgba(255,120,160,.95)';heartPath(x,cx,fy-430,30)}
  x.strokeStyle='#f2c14e';x.lineWidth=6;rr(x,40,40,CW-80,CH-80,36);x.stroke();x.lineWidth=2;x.strokeStyle='rgba(242,193,78,.6)';rr(x,58,58,CW-116,CH-116,26);x.stroke();
  [[58,58],[CW-58,58],[58,CH-58],[CW-58,CH-58]].forEach(([lx,ly])=>lantern(x,lx,ly+(ly<CH/2?60:-60),16));
  const hasMsg=!!(mine&&mine.message),msgTxt=hasMsg?'“'+mine.message+'”':'',mLen=[...msgTxt].length,fs=mLen>120?32:mLen>60?36:42,lh=Math.round(fs*1.3);
  x.font=`500 ${fs}px Mali,"Noto Sans SC",sans-serif`;const ml=hasMsg?wrap(x,msgTxt,CW-280).slice(0,7):[];
  const ph=hasMsg?150+ml.length*lh+30:250,py=CH-80-ph;x.fillStyle='rgba(5,12,36,.86)';rr(x,96,py,CW-192,ph,32);x.fill();x.strokeStyle='rgba(242,193,78,.5)';x.lineWidth=2;x.stroke();x.textAlign='center';x.textBaseline='alphabetic';
  x.fillStyle='#f2c14e';x.font='600 34px Mali,"Noto Sans SC",sans-serif';x.fillText(T('cardTitle')+' '+T('cardYear')+' · '+T('uni'),CW/2,py+58,CW-260);
  if(hasMsg){x.fillStyle='#ffdf8a';x.font='700 50px Mali,"Noto Sans SC",sans-serif';x.fillText(pose===4&&partnerSnap?mine.name+' & '+partnerSnap.name:mine.name,CW/2,py+120,CW-260);x.fillStyle='#fff6e3';x.font=`500 ${fs}px Mali,"Noto Sans SC",sans-serif`;ml.forEach((l,k)=>x.fillText(l,CW/2,py+168+k*lh,CW-260))}
  else{x.fillStyle='#fff6e3';x.font='500 44px Mali,"Noto Sans SC",sans-serif';x.fillText(T('cardEmpty'),CW/2,py+150,CW-260)}
  return c;
}
async function buildCard(){const c=await makeCard();cardURL=c.toDataURL('image/jpeg',.9);$('#cardImg').src=cardURL;$('#cardImg').alt=T('capTitle');

let actx=null,master=null,musicT=0,soundOn=false;
const NOTES=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];
function pluck(f,when,vol){const o=actx.createOscillator(),o2=actx.createOscillator(),gn=actx.createGain();o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
  gn.gain.setValueAtTime(.0001,when);gn.gain.exponentialRampToValueAtTime(vol,when+.01);gn.gain.exponentialRampToValueAtTime(.0001,when+1.1);o.connect(gn);o2.connect(gn);gn.connect(master);o.start(when);o2.start(when);o.stop(when+1.2);o2.stop(when+1.2)}
function startAudio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('Audio not supported');return false}
    actx=new AC();master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
    const n=actx.sampleRate*3,buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;const wg=actx.createGain();wg.gain.value=.5;
    const lfo=actx.createOscillator();lfo.frequency.value=.15;const lg=actx.createGain();lg.gain.value=.2;lfo.connect(lg);lg.connect(wg.gain);lfo.start();src.connect(lp);lp.connect(wg);wg.connect(master);src.start()}
  actx.resume();master.gain.setTargetAtTime(.6,actx.currentTime,.4);
  let idx=2;clearInterval(musicT);musicT=setInterval(()=>{if(Math.random()<.28)return;idx=clamp(idx+[-2,-1,-1,1,1,2][Math.random()*6|0],0,NOTES.length-1);pluck(NOTES[idx],actx.currentTime+.02,.07);if(Math.random()<.2)pluck(NOTES[Math.max(0,idx-3)]/2,actx.currentTime+.02,.05)},430);
  return true;
}
function stopAudio(){if(actx)master.gain.setTargetAtTime(0,actx.currentTime,.2);clearInterval(musicT)}
$('#bSnd').onclick=()=>{soundOn=!soundOn;if(soundOn&&!startAudio())soundOn=false;if(!soundOn)stopAudio();const b=$('#bSnd');b.setAttribute('aria-pressed',soundOn);b.setAttribute('aria-label',soundOn?T('sndOff'):T('sndOn'));
